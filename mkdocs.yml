site_name: I miei appunti di Informatica
site_url: https://sdutto3981-commits.github.io/Informatica/
repo_url: https://github.com/sdutto3981-commits/Informatica
theme:
  name: material
  language: it
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
  - awesome-pages
  - tags
  - glightbox
  - roamlinks
  - git-revision-date-localized:
      type: date
      locale: it
  - minify:
      minify_html: true
  - print-site
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
