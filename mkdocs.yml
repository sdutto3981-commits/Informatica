site_name: I miei appunti di Informatica
site_url: https://sdutto3981-commits.github.io/Informatica/
repo_url: https://github.com/sdutto3981-commits/Informatica
repo_name: sdutto3981-commits/Informatica

theme:
  name: material
  language: it
  features:
    # Navigazione
    - navigation.tabs # Aggiunge le tab in alto
    - navigation.tabs.sticky # Mantiene le tab visibili durante lo scroll
    - navigation.sections # Sezioni espandibili nella barra laterale
    - navigation.expand # Espande automaticamente tutte le sezioni
    - navigation.path # Breadcrumb (percorso) in cima alla pagina
    - navigation.indexes # Rende cliccabili i titoli delle sezioni
    - navigation.top # Pulsante per tornare in cima
    - navigation.footer # Pulsanti "Precedente" e "Successivo" a fine pagina
    - navigation.tracking # Aggiorna l'URL scorrendo le sezioni
    - navigation.prune # Ottimizza la build per siti di grandi dimensioni
    # Ricerca
    - search.highlight # Evidenzia i termini cercati
    - search.suggest # Autocompletamento della ricerca
    - search.share # Pulsante per condividere i risultati di ricerca
    # Contenuto
    - content.code.copy # Copia il blocco di codice
    - content.code.annotate # Permette di aggiungere note (+) nel codice
    - content.code.select # Facilita la selezione del testo nel codice
    - content.tabs.link # Sincronizza lo switch dei tab con lo stesso nome
    - content.tooltips # Mostra tooltip al passaggio del mouse sui link
    - content.action.edit # Pulsante per modificare la pagina su GitHub
    - content.action.view # Pulsante per visualizzare il markdown sorgente
    # Header
    - header.autohide # Nasconde l'header quando si scorre verso il basso

  # Switch Tema Chiaro / Scuro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro

plugins:
  - search
  - awesome-pages
  - tags
  - glightbox
  - roamlinks
  - git-revision-date-localized:
      type: date
      locale: it
  - minify:
      minify_html: true
  - print-site

markdown_extensions:
  # Estensioni Markdown Standard
  - abbr # Abbreviazioni
  - admonition # Avvisi e Callout
  - attr_list # Aggiunta di classi CSS agli elementi
  - def_list # Liste di definizioni
  - footnotes # Note a piè di pagina
  - md_in_html # Markdown all'interno di tag HTML
  - tables # Supporto per le tabelle
  - toc:
      permalink: true
      toc_depth: 3
  
  # Estensioni PyMdown
  - pymdownx.arithmatex: # Formule matematiche (LaTeX)
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret # Testo ^apice^
  - pymdownx.details # Admonition espandibili/collassabili (??? e ???+)
  - pymdownx.emoji: # Supporto :emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys # Tasti della tastiera (es: ++ctrl+alt+canc++)
  - pymdownx.magiclink # Rende automaticamente cliccabili gli URL
  - pymdownx.mark # Testo evidenziato ==così==
  - pymdownx.smartsymbols # Frecce e simboli tipografici automatici
  - pymdownx.snippets # Inclusione di file esterni
  - pymdownx.tabbed: # Tab di contenuto
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist: # Checkbox [ ] e [x]
      custom_checkbox: true
  - pymdownx.tilde # Testo ~barrato~ o ~pedice~
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Script necessari per il rendering delle formule matematiche (Arithmatex/MathJax)
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
